# world:
#   height: 10  # the height of the world
#   width: 10   # the width of the world
#   step_time: 0.1  # 10Hz to calculate each step
#   sample_time: 0.1  # 10 Hz for render and data extraction 
#   offset: [0, 0] # the offset of the world on x and y 

world:
  # name: "world"                       # Name of the world
  height: 20                          # Height of the world
  width: 20                           # Width of the world
  step_time: 0.1                      # Time interval between steps (10 Hz)
  sample_time: 0.1                    # Time interval for rendering and data extraction (10 Hz)
  offset: [-3, -3]                      # Positional offset of the world on the x and y axes
  control_mode: 'auto'            # Control mode ('auto' or 'keyboard')
  collision_mode: 'stop'              # Collision handling mode ('stop', 'unobstructed', 'unobstructed_obstacles')
  # obstacle_map: "path/to/map.png"     # Path to the obstacle map image file
  # mdownsample: 2                      # Downsampling factor for the obstacle map
  # status: "Running"                   # Initial simulation status
  # plot:                               # Plotting configuration
  #   show_title: true                  # Show plot title
  #   title: "Custom Simulation Title"  # Custom title (optional)
  #   figure_pixels: [1200, 800]       # Figure size in pixels
  #   saved_figure:                     # Figure saving options
  #     dpi: 150                        # Resolution for saved figures
  #     format: "png"                   # File format

robot:
  - number: 3
    # name: ["r1", "r2", "r3"]
    # distribution: {name: 'random', range_low: [-5, -5, -3.14], range_high: [15, 15, 3.14]}  
    state: [[1, 1, 0], [1, 12.5, 0], [9, 12.5, 0]]
    goal: [[10, 1, 0], [6, 12.5, 0], [12, 12.5, 0]]
    kinematics: {name: 'acker'}
    shape: {name: 'rectangle', length: 1, width: 0.62, wheelbase: 0.68}
    vel_min: [-2, -0.523]
    vel_max: [2, 0.523]
    acce: [5, 3.1416]
    behavior: {name: 'dash'}   #行为策略，这里是 'dash'（快速前往目标）。
    color: ['royalblue', 'red', 'green', 'orange', 'purple', 'yellow', 'cyan', 'magenta', 'lime', 'pink', 'brown'] 
    arrive_mode: position
    goal_threshold: 0.5
    plot:
      show_trail: False   #是否显示轨迹；
      show_goal: True    #是否显示目标点；
      show_trajectory: False   #是否显示规划轨迹。

    sensors:
      - type: 'lidar2d'   #传感器类型，这里是二维激光雷达
        range_min: 0      #最小/最大探测距离。
        range_max: 8
        angle_range: 6.2483  #探测角度范围（约为 360°）。
        number: 180      #激光束数量（180线）。
        noise: False      #是否添加传感器噪声。
        offset: [0.3, 0, 0]    #传感器在机器人上的安装偏移位置。

obstacle:
  - number: 4      #  手动布置。  静态围墙（4个）
    distribution: {name: 'manual'}    
    shape:
      - {name: 'rectangle', length: 14.5, width: 0.5}
      - {name: 'rectangle', length: 14.5, width: 0.5}
      - {name: 'rectangle', length: 14.5, width: 0.5}
      - {name: 'rectangle', length: 14.5, width: 0.5}

    state:        #：静态大型障碍物（1个）
      - [7, 14.25, 0]
      - [7, -0.25, 0]
      - [-0.25, 7, 1.5708]
      - [14.25, 7, 1.5708]

